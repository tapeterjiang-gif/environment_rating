name: CI

on:
  push:
  pull_request:

jobs:
  c-and-cpp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j2
      - name: Test
        run: ctest --test-dir build --output-on-failure

  apple:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test Swift package
        run: swift test
      - name: Build for iOS Simulator
        run: >-
          xcodebuild -scheme EnvironmentRating
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/environment-rating-ios"
          CODE_SIGNING_ALLOWED=NO build

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
          cache-dependency-path: |
            android/*.gradle.kts
            android/gradle/wrapper/gradle-wrapper.properties
            android/environment-rating/build.gradle.kts
      - uses: android-actions/setup-android@v3
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true
      - name: Install Android native toolchain
        run: >-
          sdkmanager
          "platforms;android-35"
          "build-tools;35.0.0"
          "ndk;27.2.12479018"
          "cmake;3.22.1"
      - name: Build Android AAR and run unit tests
        working-directory: android
        run: >-
          ./gradlew
          :environment-rating:assembleRelease
          :environment-rating:testDebugUnitTest
          --stacktrace
      - name: Run Android JNI tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          disable-animations: true
          script: cd android && ./gradlew :environment-rating:connectedDebugAndroidTest --stacktrace

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install Web dependencies
        working-directory: web
        run: npm ci
      - name: Build WebAssembly and TypeScript
        run: >-
          docker run --rm
          -v "$PWD:/src"
          -w /src/web
          emscripten/emsdk:4.0.15
          npm run build
      - name: Check generated Web files
        run: git diff --exit-code -- web/dist
      - name: Test Node.js API
        working-directory: web
        run: npm test
      - name: Test browser API
        working-directory: web
        run: npm run test:browser
      - name: Test environment guide pages
        run: node site/check.mjs
      - name: Check npm package contents
        working-directory: web
        run: npm pack --dry-run --ignore-scripts
