name: CI

on:
  push:
  pull_request:

jobs:
  c-and-cpp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j2
      - name: Test
        run: ctest --test-dir build --output-on-failure

  apple:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test Swift package
        run: swift test
      - name: Build for iOS Simulator
        run: >-
          xcodebuild -scheme EnvironmentRating
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/environment-rating-ios"
          CODE_SIGNING_ALLOWED=NO build

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install Web dependencies
        working-directory: web
        run: npm ci
      - name: Build WebAssembly and TypeScript
        run: >-
          docker run --rm
          -v "$PWD:/src"
          -w /src/web
          emscripten/emsdk:4.0.15
          npm run build
      - name: Check generated Web files
        run: git diff --exit-code -- web/dist
      - name: Test Node.js API
        working-directory: web
        run: npm test
      - name: Test browser API
        working-directory: web
        run: npm run test:browser
      - name: Test environment guide pages
        run: node site/check.mjs
      - name: Check npm package contents
        working-directory: web
        run: npm pack --dry-run --ignore-scripts
