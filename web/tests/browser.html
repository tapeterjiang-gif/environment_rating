<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>Environment Rating Web Test</title>
</head>
<body data-result="pending">PENDING
<script type="module">
  import {
    AirQuality,
    OutdoorIndexStandard,
    OutdoorIndexGrade,
    EnvironmentParameter,
    IlluminanceRating,
    PollenRating,
    PollenStandard,
    PollenType,
    UVIndexRating,
    ThermalSensation,
    createEnvironmentRating
  } from "../dist/index.js";

  try {
    const rating = await createEnvironmentRating();
    const comfort = rating.thermal.evaluate({
      temperature: 25,
      humidity: 50,
      radiantTemperature: 25,
      airSpeed: 0.1,
      met: 1.1,
      clo: 0.5
    });
    const indexPassed = rating.outdoorIndex.rate(150, OutdoorIndexStandard.neaPSI) === OutdoorIndexGrade.grade3
      && rating.outdoorIndex.rate(301, OutdoorIndexStandard.neaPSI) === OutdoorIndexGrade.grade5
      && rating.outdoorIndex.rate(301, OutdoorIndexStandard.epaAQI2026) === OutdoorIndexGrade.grade6
      && rating.outdoorIndex.rate(50, OutdoorIndexStandard.hj6332026) === OutdoorIndexGrade.grade1
      && rating.outdoorIndex.rate(6, OutdoorIndexStandard.eea2024) === OutdoorIndexGrade.grade6;
    const passed = indexPassed && rating.air.co2(1000) === AirQuality.moderate
      && rating.air.no2Eea(151) === AirQuality.extremelyPoor
      && rating.air.no2HjDaily(565.5) === AirQuality.extremelyPoor
      && rating.air.no2Epa(54) === AirQuality.fair
      && rating.air.so2Eea(276) === AirQuality.extremelyPoor
      && rating.air.so2Epa(305, 304) === AirQuality.poor
      && rating.pollen.rate(20, PollenType.grass, PollenStandard.nab) === PollenRating.high
      && rating.uvIndex.rate(7.5) === UVIndexRating.veryHigh
      && rating.soundLight.illuminance(540) === IlluminanceRating.detailWork
      && comfort?.sensation === ThermalSensation.neutral
      && rating.colors.parameter(EnvironmentParameter.temperature)?.primary === "#F97316"
      && rating.colors.parameter(EnvironmentParameter.uvIndex)?.primary === "#6853BE"
      && rating.colors.air(EnvironmentParameter.co2, AirQuality.moderate)?.graphic === "#FACC15";
    document.body.dataset.result = passed ? "pass" : "fail";
    document.body.textContent = passed ? "PASS" : "FAIL";
  } catch (error) {
    document.body.dataset.result = "fail";
    document.body.textContent = `FAIL: ${error instanceof Error ? error.message : error}`;
  }
</script>
</body>
</html>
